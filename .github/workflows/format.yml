name: Check Format

on:
  pull_request:
    branches: [main, master, dev, develop]

jobs:
  check-formatting:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python clang-format.py